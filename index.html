<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF6E9">
<title>早安廚房｜簡單早餐食譜</title>
<style>
  :root{
    --bg:#FFF6E9; --card:#FFFFFF; --ink:#3A2E25; --muted:#8A7B6E;
    --accent:#E8833A; --accent-soft:#FCE3CF; --line:#EEDFCF; --ok:#5B9A68; --warn:#FFF1C9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.6}
  header{padding:28px 20px 12px;max-width:960px;margin:0 auto}
  h1{margin:0;font-size:28px;letter-spacing:1px}
  .sub{margin:4px 0 0;color:var(--muted)}
  main{max-width:960px;margin:0 auto;padding:0 20px 60px}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 10px}
  .toolbar input{flex:1 1 220px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
  .btn{border:none;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;font-family:inherit}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.dark{background:var(--ink)}
  .btn.danger{background:#fff;color:#B23B2E;border:1px solid #E9B8B1}
  .btn.small{padding:8px 12px;font-size:14px}
  .admin{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .banner{display:none;background:var(--warn);border:1px solid #F0D98A;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .banner.show{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .15s, box-shadow .15s;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(58,46,37,.08)}
  .ph{aspect-ratio:16/10;background:repeating-linear-gradient(45deg,#F7EBDD,#F7EBDD 10px,#F3E4D3 10px,#F3E4D3 20px);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;position:relative;overflow:hidden}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card-body{padding:14px 16px 16px}
  .card h3{margin:0 0 6px;font-size:18px}
  .meta{display:flex;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap;align-items:center}
  .tag{background:var(--accent-soft);color:#A4521A;border-radius:6px;padding:1px 8px;font-size:12px}
  .fav{position:absolute;top:10px;right:10px;z-index:1;background:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}

  .overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.show{display:flex}
  .sheet{position:relative;background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 30px}
  @media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}}
  .sheet .ph{aspect-ratio:16/8}
  .sheet-inner{padding:18px 22px}
  .sheet h2{margin:0 0 6px}
  .close{position:absolute;top:12px;right:12px;background:#fff;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;z-index:2}
  .serv{display:flex;align-items:center;gap:10px;margin:14px 0;background:var(--bg);padding:10px 14px;border-radius:12px}
  .serv button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
  .serv b{min-width:24px;text-align:center;font-size:18px}
  h4{margin:18px 0 8px;font-size:16px;border-left:4px solid var(--accent);padding-left:8px}
  ul.ing{list-style:none;padding:0;margin:0}
  ul.ing li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  ul.ing li label{display:flex;gap:8px;align-items:center;cursor:pointer}
  ul.ing li.done span{text-decoration:line-through;color:var(--muted)}
  ol.steps{padding-left:22px;margin:0}
  ol.steps li{margin-bottom:10px}
  .tip{background:#F1F7F2;border-radius:12px;padding:10px 14px;color:#3E6B48;font-size:14px;margin-top:14px}
  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

  /* 表單 */
  .form label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  .form input[type=text],.form input[type=number],.form select,.form textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
  .form textarea{min-height:110px;resize:vertical}
  .form .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:520px){.form .row{grid-template-columns:repeat(2,1fr)}}
  .hint{color:var(--muted);font-size:12px;font-weight:400}
  .err{color:#B23B2E;font-size:14px;margin-top:10px;min-height:1em}
  .photo-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .photo-box .ph{width:160px;aspect-ratio:16/10;border-radius:10px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw}
  .toast.show{display:block}
  .help ol{padding-left:20px} .help li{margin-bottom:8px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
</style>
</head>
<body>

<header>
  <h1>🍳 早安廚房</h1>
  <p class="sub">15 分鐘內搞定的簡單早餐食譜</p>
</header>

<main>
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋食譜或食材，例如：蛋、吐司">
    <button class="btn" id="randomBtn">🎲 今天吃什麼？</button>
    <button class="btn ghost" id="favBtn">♡ 我的收藏</button>
  </div>
  <div class="admin">
    <button class="btn dark small" id="addBtn">＋ 新增食譜</button>
    <button class="btn ghost small" id="publishBtn">📤 發布給所有人</button>
  </div>
  <div class="banner" id="banner">
    <span>📝 你有修改只存在<b>這台裝置</b>，別人還看不到。</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" id="bannerPublish">📤 發布</button>
      <button class="btn ghost small" id="resetBtn">↩ 還原網站版本</button>
    </span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<footer>早安廚房 v2.0 ・ 份量可自由調整 ・ 新增與收藏先存在這台裝置，按「發布」才會給所有人看</footer>

<script>
/* ===== 預設食譜（網站上沒有 recipes.json 時使用） ===== */
const DEFAULT_RECIPES = [
  { id:"french-toast", name:"法式吐司", time:10, level:"簡單", type:"甜", servings:1,
    ingredients:[{name:"吐司",qty:2,unit:"片"},{name:"雞蛋",qty:1,unit:"顆"},{name:"牛奶",qty:50,unit:"ml"},{name:"奶油",qty:5,unit:"g"},{name:"蜂蜜或楓糖",qty:1,unit:"大匙"}],
    steps:["雞蛋打散，加入牛奶攪拌均勻。","吐司兩面各浸入蛋液約 10 秒。","平底鍋中小火融化奶油，放入吐司。","每面煎約 2 分鐘至金黃。","盛盤，淋上蜂蜜或楓糖。"],
    tip:"吐司放隔夜、稍微乾一點，比較吸蛋液、不容易破。" },
  { id:"ham-cheese-egg", name:"火腿起司蛋吐司", time:8, level:"簡單", type:"鹹", servings:1,
    ingredients:[{name:"吐司",qty:2,unit:"片"},{name:"雞蛋",qty:1,unit:"顆"},{name:"火腿",qty:1,unit:"片"},{name:"起司片",qty:1,unit:"片"},{name:"沙拉油",qty:1,unit:"小匙"}],
    steps:["吐司放進烤麵包機烤至微脆。","平底鍋加油，煎一顆荷包蛋。","火腿片放入鍋中兩面各煎 30 秒。","吐司依序疊上起司、火腿、荷包蛋，再蓋上另一片吐司。","斜切對半即可。"],
    tip:"起司放在熱吐司上會微微融化，口感更好。" },
  { id:"oat-yogurt", name:"燕麥優格杯", time:5, level:"簡單", type:"甜", servings:1,
    ingredients:[{name:"無糖優格",qty:150,unit:"g"},{name:"即食燕麥",qty:30,unit:"g"},{name:"香蕉",qty:0.5,unit:"根"},{name:"藍莓或當季水果",qty:50,unit:"g"},{name:"蜂蜜",qty:1,unit:"小匙"}],
    steps:["香蕉切片、水果洗淨備用。","杯中先放一半優格，鋪上一半燕麥。","重複一次優格和燕麥。","最上層放水果，淋上蜂蜜。"],
    tip:"前一晚做好放冰箱，燕麥會吸收水分變軟，早上直接吃。" },
  { id:"egg-pancake", name:"蔥花蛋餅", time:10, level:"簡單", type:"鹹", servings:1,
    ingredients:[{name:"市售冷凍蛋餅皮",qty:1,unit:"張"},{name:"雞蛋",qty:1,unit:"顆"},{name:"青蔥",qty:1,unit:"根"},{name:"鹽",qty:0.25,unit:"小匙"},{name:"沙拉油",qty:1,unit:"小匙"}],
    steps:["青蔥切成蔥花，和雞蛋、鹽一起打散。","平底鍋加油，中火倒入蛋液。","蛋液半熟時，蓋上蛋餅皮（不用退冰）。","約 1 分鐘後翻面，再煎 1–2 分鐘至餅皮微焦。","捲起切段，可沾醬油膏。"],
    tip:"加一片起司或玉米粒，就是起司蛋餅、玉米蛋餅。" },
  { id:"banana-pancake", name:"香蕉鬆餅", time:15, level:"中等", type:"甜", servings:2,
    ingredients:[{name:"熟香蕉",qty:1,unit:"根"},{name:"雞蛋",qty:1,unit:"顆"},{name:"鬆餅粉",qty:100,unit:"g"},{name:"牛奶",qty:80,unit:"ml"},{name:"奶油",qty:5,unit:"g"}],
    steps:["香蕉用叉子壓成泥。","加入雞蛋、牛奶拌勻，再加入鬆餅粉拌到沒有粉粒。","平底鍋小火抹薄薄一層奶油。","每次倒入約一大湯匙麵糊，表面冒泡泡時翻面。","兩面金黃即可起鍋。"],
    tip:"香蕉越熟越甜，表皮有黑點的最適合。" },
  { id:"avocado-toast", name:"酪梨蛋吐司", time:10, level:"簡單", type:"鹹", servings:1,
    ingredients:[{name:"全麥吐司",qty:1,unit:"片"},{name:"熟酪梨",qty:0.5,unit:"顆"},{name:"雞蛋",qty:1,unit:"顆"},{name:"檸檬汁",qty:1,unit:"小匙"},{name:"鹽與黑胡椒",qty:null,unit:"少許"}],
    steps:["雞蛋放入滾水煮 7 分鐘，泡冷水後剝殼切片。","酪梨壓成泥，加檸檬汁、鹽拌勻。","吐司烤至微脆，抹上酪梨泥。","鋪上蛋片，撒黑胡椒。"],
    tip:"檸檬汁可以防止酪梨變黑。" }
];

const LOCAL_KEY = "breakfast-recipes-local";
let siteRecipes = DEFAULT_RECIPES;   // 網站版本
let RECIPES = DEFAULT_RECIPES;       // 目前顯示的版本

/* ===== 小工具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg, ms=3000){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),ms); }
function fmt(n){ const v=Math.round(n*100)/100; return Number.isInteger(v)?v:String(v); }
function store(key,val){ try{ if(val===null) localStorage.removeItem(key); else localStorage.setItem(key,JSON.stringify(val)); return true; }catch(e){ return false; } }
function load(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }

/* ===== 收藏 ===== */
let favs = load("breakfast-favs") || [];
const saveFavs = () => store("breakfast-favs", favs);

/* ===== 本機修改 / 發布狀態 ===== */
function hasUnpublished(){ return load(LOCAL_KEY) && JSON.stringify(RECIPES)!==JSON.stringify(siteRecipes); }
function updateBanner(){ $("#banner").classList.toggle("show", !!hasUnpublished()); }
function saveLocal(){
  if(!store(LOCAL_KEY, RECIPES)){
    toast("⚠️ 儲存失敗：瀏覽器空間不足，請刪掉幾張照片或先發布", 5000); return false;
  }
  updateBanner(); return true;
}

/* ===== 列表 ===== */
const FILTERS = ["全部","鹹","甜","10 分鐘內"];
let filter="全部", keyword="", onlyFav=false;

function photo(r){
  if(r.noPhoto) return `<div class="ph"><span>圖片位置</span></div>`;
  const src = r.photo || ("images/" + r.id + ".jpg");
  return `<div class="ph"><span>圖片位置</span><img src="${esc(src)}" alt="${esc(r.name)}" loading="lazy" onerror="this.remove()"></div>`;
}
function renderChips(){
  $("#chips").innerHTML = FILTERS.map(f=>`<button class="chip ${f===filter?'on':''}" data-f="${f}">${f}</button>`).join("");
}
function match(r){
  if(onlyFav && !favs.includes(r.id)) return false;
  if(filter==="鹹" && r.type!=="鹹") return false;
  if(filter==="甜" && r.type!=="甜") return false;
  if(filter==="10 分鐘內" && r.time>10) return false;
  if(keyword){ const t=r.name+r.ingredients.map(i=>i.name).join(""); if(!t.includes(keyword)) return false; }
  return true;
}
function renderGrid(){
  const list = RECIPES.filter(match);
  if(!list.length){
    $("#grid").innerHTML = `<p class="empty">${onlyFav?"還沒有收藏，點卡片右上角的 ♡ 加入收藏":"找不到符合的食譜"}</p>`; return;
  }
  $("#grid").innerHTML = list.map(r=>`
    <div class="card" data-id="${esc(r.id)}">
      <button class="fav" data-fav="${esc(r.id)}" aria-label="收藏">${favs.includes(r.id)?'❤️':'🤍'}</button>
      ${photo(r)}
      <div class="card-body">
        <h3>${esc(r.name)}</h3>
        <div class="meta"><span>⏱ ${esc(r.time)} 分鐘</span><span>👤 ${esc(r.servings)} 人份</span>
          <span class="tag">${esc(r.type)}</span><span class="tag">${esc(r.level)}</span></div>
      </div>
    </div>`).join("");
}

$("#chips").addEventListener("click", e=>{ const f=e.target.dataset.f; if(!f) return; filter=f; renderChips(); renderGrid(); });
$("#grid").addEventListener("click", e=>{
  const fid=e.target.dataset.fav;
  if(fid){ e.stopPropagation(); favs=favs.includes(fid)?favs.filter(x=>x!==fid):[...favs,fid]; saveFavs(); renderGrid(); return; }
  const c=e.target.closest(".card"); if(c) openRecipe(c.dataset.id);
});
$("#q").addEventListener("input", e=>{ keyword=e.target.value.trim(); renderGrid(); });
$("#favBtn").addEventListener("click", ()=>{ onlyFav=!onlyFav; $("#favBtn").textContent=onlyFav?"← 全部食譜":"♡ 我的收藏"; renderGrid(); });
$("#randomBtn").addEventListener("click", ()=>{ if(RECIPES.length) openRecipe(RECIPES[Math.floor(Math.random()*RECIPES.length)].id); });

/* ===== 彈出視窗 ===== */
function openSheet(html){ $("#sheet").innerHTML = `<button class="close" data-close aria-label="關閉">✕</button>` + html; $("#sheet").scrollTop=0; $("#overlay").classList.add("show"); document.body.style.overflow="hidden"; }
function closeSheet(){ $("#overlay").classList.remove("show"); document.body.style.overflow=""; }
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay" || e.target.hasAttribute("data-close")) closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

/* ===== 食譜詳細頁 ===== */
let current=null, people=1;
function openRecipe(id){ current=RECIPES.find(r=>r.id===id); if(!current) return; people=current.servings; renderRecipe(); }
function renderRecipe(){
  const r=current, ratio=people/r.servings;
  openSheet(`
    ${photo(r)}
    <div class="sheet-inner">
      <h2>${esc(r.name)}</h2>
      <div class="meta"><span>⏱ ${esc(r.time)} 分鐘</span><span class="tag">${esc(r.type)}</span><span class="tag">${esc(r.level)}</span></div>
      <div class="serv">份量 <button id="minus">−</button><b>${people}</b><button id="plus">＋</button> 人份</div>
      <h4>食材（打勾＝已備好）</h4>
      <ul class="ing">${r.ingredients.map(i=>`
        <li><label><input type="checkbox"><span>${esc(i.name)}</span></label>
        <span>${i.qty==null ? esc(i.unit) : fmt(i.qty*ratio)+" "+esc(i.unit)}</span></li>`).join("")}</ul>
      <h4>步驟</h4>
      <ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${r.tip?`<div class="tip">💡 小撇步：${esc(r.tip)}</div>`:""}
      <div class="actions">
        <button class="btn ghost small" id="editBtn">✏️ 編輯</button>
        <button class="btn danger small" id="delBtn">🗑 刪除</button>
      </div>
    </div>`);
  $("#minus").onclick=()=>{ if(people>1){people--;renderRecipe();} };
  $("#plus").onclick =()=>{ if(people<10){people++;renderRecipe();} };
  $("#sheet").querySelectorAll("ul.ing input").forEach(cb=>cb.onchange=()=>cb.closest("li").classList.toggle("done",cb.checked));
  $("#editBtn").onclick=()=>openForm(r);
  $("#delBtn").onclick=()=>{
    if(!confirm(`確定刪除「${r.name}」？\n（發布前都可以按「還原網站版本」救回）`)) return;
    RECIPES = RECIPES.filter(x=>x.id!==r.id);
    if(saveLocal()){ closeSheet(); renderGrid(); toast("已刪除「"+r.name+"」"); }
  };
}

/* ===== 新增 / 編輯表單 ===== */
let formPhoto=null;
function ingToText(list){ return list.map(i=> i.qty==null ? `${i.name} ${i.unit}`.trim() : `${i.name} ${fmt(i.qty)} ${i.unit}`.trim()).join("\n"); }
function parseIng(text){
  return text.split("\n").map(s=>s.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^(.+?)\s+(\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
    if(m){ let q=m[2]; q=q.includes("/")?(+q.split("/")[0])/(+q.split("/")[1]):+q; return {name:m[1].trim(),qty:q,unit:m[3].trim()}; }
    const sp=line.lastIndexOf(" ");
    return sp>0 ? {name:line.slice(0,sp).trim(),qty:null,unit:line.slice(sp+1).trim()} : {name:line,qty:null,unit:""};
  });
}
function openForm(r){
  const isNew=!r;
  r = r || {name:"",time:10,servings:1,type:"鹹",level:"簡單",ingredients:[],steps:[],tip:""};
  formPhoto = r.photo || null;
  openSheet(`
    <div class="sheet-inner form">
      <h2>${isNew?"＋ 新增食譜":"✏️ 編輯食譜"}</h2>
      <label class="f">食譜名稱 *</label>
      <input type="text" id="fName" value="${esc(r.name)}" placeholder="例如：鮪魚蛋餅">
      <div class="row">
        <div><label class="f">時間（分鐘）</label><input type="number" id="fTime" min="1" value="${esc(r.time)}"></div>
        <div><label class="f">基本人份</label><input type="number" id="fServ" min="1" value="${esc(r.servings)}"></div>
        <div><label class="f">口味</label><select id="fType">${["鹹","甜"].map(o=>`<option ${o===r.type?"selected":""}>${o}</option>`).join("")}</select></div>
        <div><label class="f">難度</label><select id="fLevel">${["簡單","中等","進階"].map(o=>`<option ${o===r.level?"selected":""}>${o}</option>`).join("")}</select></div>
      </div>
      <label class="f">食材 * <span class="hint">一行一項，格式「名稱 數量 單位」，例：雞蛋 1 顆；不需換算的寫「鹽 少許」</span></label>
      <textarea id="fIng" placeholder="雞蛋 1 顆&#10;吐司 2 片&#10;鹽 少許">${esc(ingToText(r.ingredients))}</textarea>
      <label class="f">步驟 * <span class="hint">一行一步</span></label>
      <textarea id="fSteps" placeholder="雞蛋打散&#10;平底鍋加油加熱">${esc(r.steps.join("\n"))}</textarea>
      <label class="f">小撇步 <span class="hint">可留空</span></label>
      <input type="text" id="fTip" value="${esc(r.tip)}">
      <label class="f">照片 <span class="hint">JPG / PNG，會自動縮小</span></label>
      <div class="photo-box">
        <div class="ph" id="fPrev">${formPhoto?`<img src="${esc(formPhoto)}">`:"未選照片"}</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <input type="file" id="fFile" accept="image/jpeg,image/png,image/webp">
          <button class="btn ghost small" id="fNoPhoto" type="button">移除照片</button>
        </div>
      </div>
      <div class="err" id="fErr"></div>
      <div class="actions">
        <button class="btn" id="fSave">💾 儲存</button>
        <button class="btn ghost" data-close>取消</button>
      </div>
    </div>`);
  $("#fFile").onchange = e => readPhoto(e.target.files[0]);
  $("#fNoPhoto").onclick = () => { formPhoto=""; $("#fPrev").innerHTML="未選照片"; $("#fFile").value=""; };
  $("#fSave").onclick = () => saveForm(isNew ? null : r.id);
}
function readPhoto(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=800, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      formPhoto=c.toDataURL("image/jpeg",0.75);
      $("#fPrev").innerHTML=`<img src="${formPhoto}">`;
    };
    img.onerror=()=>{ $("#fErr").textContent="這張照片的格式無法讀取（例如 iPhone 的 HEIC），請改用 JPG 或 PNG。"; };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function saveForm(editId){
  const name=$("#fName").value.trim();
  const ingredients=parseIng($("#fIng").value);
  const steps=$("#fSteps").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const time=Math.max(1,parseInt($("#fTime").value)||1), servings=Math.max(1,parseInt($("#fServ").value)||1);
  const err=[];
  if(!name) err.push("請填食譜名稱");
  if(!ingredients.length) err.push("請至少填一項食材");
  if(!steps.length) err.push("請至少填一個步驟");
  if(err.length){ $("#fErr").textContent="⚠️ "+err.join("、"); return; }
  const data={name,time,servings,type:$("#fType").value,level:$("#fLevel").value,ingredients,steps,tip:$("#fTip").value.trim()};
  let rec;
  if(editId){
    const old=RECIPES.find(x=>x.id===editId);
    rec={...old,...data};
    if(formPhoto){ rec.photo=formPhoto; delete rec.noPhoto; }
    else if(formPhoto===""){ delete rec.photo; rec.noPhoto=true; }
    RECIPES=RECIPES.map(x=>x.id===editId?rec:x);
  }else{
    rec={id:"r"+Date.now(),...data}; if(formPhoto) rec.photo=formPhoto;
    RECIPES=[...RECIPES,rec];
  }
  if(saveLocal()){ renderGrid(); current=rec; people=rec.servings; renderRecipe(); toast("已儲存在這台裝置。要給所有人看，記得按「📤 發布」"); }
}

/* ===== 發布 ===== */
function publish(){
  const data={app:"早安廚房",updated:new Date().toISOString(),recipes:RECIPES};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="recipes.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  openSheet(`
    <div class="sheet-inner help">
      <h2>📤 已下載 recipes.json</h2>
      <p>再做一步，所有人就能看到：</p>
      <ol>
        <li>到 GitHub 你的 <b>breakfast-recipes</b> 專案</li>
        <li>按 <b>Add file → Upload files</b></li>
        <li>把剛下載的 <b>recipes.json</b> 拖進去（檔名必須完全是 recipes.json，若變成 recipes (1).json 請先改名）</li>
        <li>按 <b>Commit changes</b></li>
        <li>等 1–10 分鐘，重新整理網頁；黃色提示消失就代表發布成功</li>
      </ol>
      <div class="actions"><button class="btn" data-close>知道了</button></div>
    </div>`);
}
$("#publishBtn").onclick=publish;
$("#bannerPublish").onclick=publish;
$("#addBtn").onclick=()=>openForm(null);
$("#resetBtn").onclick=()=>{
  if(!confirm("要丟掉這台裝置上尚未發布的修改，回到網站版本嗎？")) return;
  store(LOCAL_KEY,null); RECIPES=clone(siteRecipes); renderGrid(); updateBanner(); toast("已還原為網站版本");
};

/* ===== 啟動：讀網站的 recipes.json → 再套用本機修改 ===== */
(async function init(){
  renderChips();
  try{
    const res=await fetch("recipes.json",{cache:"no-store"});
    if(res.ok){ const j=await res.json(); if(Array.isArray(j.recipes)) siteRecipes=j.recipes; }
  }catch(e){ /* 沒有 recipes.json 或在本機開啟：使用預設食譜 */ }
  const local=load(LOCAL_KEY);
  if(local && JSON.stringify(local)===JSON.stringify(siteRecipes)){ store(LOCAL_KEY,null); }  // 已發布，清掉本機副本
  RECIPES = (load(LOCAL_KEY)) || clone(siteRecipes);
  renderGrid(); updateBanner();
})();
</script>
</body>
</html>
